name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v7+ of the action supports the v2 linter series only; v2.13
          # is the current release line, compatible with modern Go.
          version: v2.13
          args: --timeout 5m
      - name: Test
        run: go test -race -timeout 10m ./...
