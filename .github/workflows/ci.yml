name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # The config is golangci-lint v2 format; the action's default
          # linter is the 1.x series, which rejects it.
          version: v2.1
          args: --timeout 5m
      - name: Test
        run: go test -race -timeout 10m ./...
