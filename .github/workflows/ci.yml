name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          # v7+ of the action supports the v2 linter series only; v2.13
          # is the current release line, compatible with modern Go.
          version: v2.13
          args: --timeout 5m
      - name: Test
        run: go test -race -timeout 10m ./...
      - name: Build
        run: make build
