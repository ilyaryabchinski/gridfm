name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -timeout 10m ./...

      - name: Build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME}"

      # Reproducibility needs a cross-build comparison: rebuild and
      # diff against the FIRST build's checksums. Checking regenerated
      # checksums would compare a build with itself.
      - name: Verify reproducibility
        run: |
          cp dist/checksums.txt /tmp/first-build.txt
          make release VERSION="${GITHUB_REF_NAME}"
          cd dist
          sha256sum -c checksums.txt
          diff /tmp/first-build.txt checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -timeout 10m ./...
      - name: Build release artifacts
        run: make release-macos VERSION="${GITHUB_REF_NAME}" ARCH="${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
